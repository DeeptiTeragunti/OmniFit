# Shared across every configserver client (Spring Cloud Config's "application.yml" convention -
# merged in for every service regardless of spring.application.name).
#
# On Windows/WSL, Eureka's default self-registration uses the machine's local hostname, which
# can resolve to a virtual adapter name (e.g. *.mshome.net) that nothing else on the network can
# actually look up in DNS. Registering by IP instead sidesteps that entirely.
eureka:
  instance:
    prefer-ip-address: true

# Shared between the gateway (which stamps this header on every proxied request) and
# userservice/activityservice/aiservice (which each reject any request missing it) - proves
# a request actually passed through the gateway's JWT verification rather than hitting a
# service directly. Change for any real deployment.
internal:
  api:
    secret: ${INTERNAL_API_SECRET:local-dev-internal-secret-change-me}
